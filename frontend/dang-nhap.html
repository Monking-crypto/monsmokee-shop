<!doctype html>
<html lang="vi">
<head>
<title>Đăng nhập - MON SMOKEE</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<div class="auth">
  <aside class="auth__aside">
    <a href="index.html"><img class="auth__logo" src="assets/img/logo.svg" alt="MON SMOKEE"></a>
    <div><h2>Chợ gần nhà, bấm là có</h2>
      <ul class="auth__perks">
        <li><i class="bi bi-truck" aria-hidden="true"></i>Giao tận nhà trong nội thành Đồng Hới</li>
        <li><i class="bi bi-shop" aria-hidden="true"></i>Đặt trước, đến lấy tại cửa hàng, không phí ship</li>
        <li><i class="bi bi-receipt" aria-hidden="true"></i>Xem lại đơn hàng và mua lại dễ dàng</li>
      </ul></div>
    <img class="auth__art" src="assets/img/placeholder-product.svg" alt="">
  </aside>
  <main class="auth__main">
    <div class="auth__card">
      <a class="auth__mobile-logo" href="index.html"><img src="assets/img/logo.svg" alt="MON SMOKEE"></a>
      <h1>Đăng nhập</h1>
      <p class="lead">Dùng số điện thoại bạn đã đăng ký.</p>
      <div id="login-alert" class="auth__alert" role="alert" hidden></div>
      <form id="login-form" novalidate>
        <div class="field"><label for="phone">Số điện thoại</label>
          <div class="field__box"><input id="phone" name="so_dien_thoai" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" aria-describedby="phone-err"></div>
          <p class="field__error" id="phone-err" role="alert"></p></div>
        <div class="field"><label for="password">Mật khẩu</label>
          <div class="field__box"><input id="password" name="mat_khau" type="password" autocomplete="current-password" aria-describedby="pass-err"></div>
          <p class="field__error" id="pass-err" role="alert"></p></div>
        <div class="auth__row"><span></span><a href="quen-mat-khau.html">Quên mật khẩu?</a></div>
        <button id="login-btn" class="ms-btn ms-btn--primary ms-btn--block" type="submit">Đăng nhập</button>
      </form>
      <p class="auth__alt">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký</a></p>
    </div>
  </main>
</div>
<script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
